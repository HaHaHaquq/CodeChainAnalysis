[package]
name = "chain-analysis"
version = "0.7.1"
description = "Embedded C/C++ Call-Chain, Callback, Stack & Porting Boundary Desktop App"
authors = ["ChainAnalysis"]
edition = "2021"

[lib]
name = "chain_analysis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
encoding_rs = "0.8"
roxmltree = "0.20"
tree-sitter = "0.24"
tree-sitter-c = "0.23"

[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

